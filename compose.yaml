name: collaboard

services:
  mongo:
    image: mongo:7.0.40-jammy
    restart: unless-stopped

    volumes:
      - collaboard_mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: "mongodb://mongo:27017/${MONGODB_DATABASE_NAME:-collaboard}"
      MONGODB_DATABASE_NAME: "${MONGODB_DATABASE_NAME:-collaboard}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env.docker}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1h}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      SEED_DEVELOPMENT_DATA: "false"

    depends_on:
      mongo:
        condition: service_healthy

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "--eval",
          "const response = await fetch('http://127.0.0.1:5000/api/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "8080:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile

    profiles:
      - tools

    environment:
      NODE_ENV: development
      MONGODB_URI: "mongodb://mongo:27017/${MONGODB_DATABASE_NAME:-collaboard}"
      MONGODB_DATABASE_NAME: "${MONGODB_DATABASE_NAME:-collaboard}"
      SEED_DEVELOPMENT_DATA: "true"
      DEVELOPMENT_SEED_PASSWORD: "${DEVELOPMENT_SEED_PASSWORD:-CollaBoard123!}"

    depends_on:
      mongo:
        condition: service_healthy

    command:
      [
        "npm",
        "run",
        "seed:development",
        "--",
        "--confirm-reset",
      ]

volumes:
  collaboard_mongo_data: